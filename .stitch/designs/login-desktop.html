          },
        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .tactile-card {
            border: 1.5px solid rgba(35, 48, 90, 0.08);
            box-shadow: 0 4px 20px -2px rgba(10, 24, 66, 0.04);
        }

        .form-input-focus:focus {
            outline: none;
            border-color: #006951;
            box-shadow: 0 0 0 4px rgba(0, 105, 81, 0.1);
        }

        .btn-hover-arrow:hover span[data-icon="arrow_forward"] {
            transform: translateX(4px);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen overflow-x-hidden">
<main class="flex flex-col md:flex-row min-h-screen">
<!-- Left Side: Branding & Illustration -->
<section class="relative w-full md:w-1/2 bg-surface flex flex-col items-center justify-center p-lg overflow-hidden">
<!-- Decorative Blobs -->
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-fixed/20 blur-3xl rounded-full"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-secondary-fixed/20 blur-3xl rounded-full"></div>
<!-- Logo -->
<div class="absolute top-10 left-10 z-20">
<div class="flex items-center gap-2">
<span class="font-headline-lg text-headline-lg text-primary font-bold">EduAI</span>
</div>
</div>
<!-- Floating Badges -->
<div class="absolute top-1/4 left-20 z-20 animate-float" style="animation-delay: 0.5s;">
<div class="bg-white/90 backdrop-blur-sm p-4 rounded-2xl shadow-xl flex items-center gap-3 border border-surface-variant">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined" data-icon="smart_toy">smart_toy</span>
</div>
<div>
<p class="text-[12px] font-bold text-on-surface-variant leading-none">Assistant</p>
<p class="text-[10px] text-outline">Always Active</p>
</div>
</div>
</div>
<div class="absolute bottom-1/4 right-20 z-20 animate-float" style="animation-delay: 1.2s;">
<div class="bg-white/90 backdrop-blur-sm p-4 rounded-2xl shadow-xl flex items-center gap-3 border border-surface-variant">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" data-icon="insights">insights</span>
</div>
<div>
<p class="text-[12px] font-bold text-on-surface-variant leading-none">Insight</p>
<p class="text-[10px] text-outline">Real-time Data</p>
</div>
</div>
</div>
<!-- Central Content -->
<div class="relative z-10 text-center max-w-lg">
<div class="mb-lg">
<img alt="3D graduation cap resting on a stack of books" class="w-full h-auto drop-shadow-2xl" src="https://lh3.googleusercontent.com/aida-public/AKb67V9-pL_yM9A9uXj7p2H8_K9wG6nJ_o3B8fXzI1Q2pL4_o5_G_mZ1rW6n_A=s800"/>
</div>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed max-w-sm mx-auto">
                    Empowering education through artificial intelligence
                </p>
</div>
</section>
<!-- Right Side: Login Form -->
<section class="w-full md:w-1/2 flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface-container-low">
<div class="w-full max-w-md bg-surface-container-lowest p-lg rounded-[32px] tactile-card">
<!-- Header -->
<header class="mb-lg text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant" id="greeting">Good afternoon! Your AI assistant is ready.</p>
</header>
<!-- Role Toggle -->
<div class="mb-lg p-base bg-surface-variant rounded-full flex gap-1">
<button class="flex-1 py-3 px-6 rounded-full font-label-md text-label-md flex items-center justify-center gap-2 transition-all duration-300 bg-primary-container text-on-primary-container shadow-sm" id="teacherBtn" onclick="setRole('teacher')">
<span class="material-symbols-outlined text-[20px]" data-icon="school">school</span>
                        Teacher
                    </button>
<button class="flex-1 py-3 px-6 rounded-full font-label-md text-label-md flex items-center justify-center gap-2 transition-all duration-300 text-on-surface-variant" id="studentBtn" onclick="setRole('student')">
<span class="material-symbols-outlined text-[20px]" data-icon="face">face</span>
                        Student
                    </button>
</div>
<!-- Form Fields -->
<form class="space-y-base" onsubmit="event.preventDefault();">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface ml-base" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="mail">mail</span>
<input class="form-input-focus w-full pl-12 pr-md py-4 rounded-xl border-2 border-surface-container-highest bg-white text-on-surface placeholder:text-outline-variant font-body-md transition-all" id="email" placeholder="e.g. name@school.edu" type="email"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center px-base">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline font-bold" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="lock">lock</span>
<input class="form-input-focus w-full pl-12 pr-md py-4 rounded-xl border-2 border-surface-container-highest bg-white text-on-surface placeholder:text-outline-variant font-body-md transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- CTA Button -->
<div class="pt-md space-y-base">
<button class="btn-hover-arrow w-full py-4 bg-secondary-container text-white font-label-md text-label-md rounded-full shadow-lg hover:shadow-xl hover:scale-[1.01] active:scale-95 transition-all flex items-center justify-center gap-2">
                            Login to Dashboard
                            <span class="material-symbols-outlined transition-transform duration-300" data-icon="arrow_forward">arrow_forward</span>
</button>
<div class="flex items-center gap-4 py-4">
<div class="h-px flex-1 bg-surface-container-highest"></div>
<span class="font-label-sm text-label-sm text-outline-variant uppercase tracking-wider">OR CONTINUE WITH</span>
<div class="h-px flex-1 bg-surface-container-highest"></div>
</div>
<div class="grid grid-cols-2 gap-base">
<button class="flex items-center justify-center gap-2 py-3 px-4 border-2 border-surface-container-highest rounded-xl font-label-md text-label-md text-on-surface-variant hover:bg-surface-container transition-colors">
<img alt="Google Logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJkzg9rDLE7XZdaUozY_15Wi43RZS2kgdG0eeCJ9pkLVFuDyNSoaWsi8H4h5t8CXZuG6cKkJHO1jt9hzxmRrbOn6crP1dWEvxsNkk0l5YV66sOKe88wd3ygQgQ8d8snOpgDfXJ9rNqdEUYXf0jOZfG39mEp6mOVu1GVKWWZWwezFrTACmZQcEGKPJlURa_mU5Pk7xVSrajlsEXdnZ5kRzXUs2POOXh4n7ffNCKS6oqeG1B0eZYPg5M"/>
                                Google
                            </button>
<button class="flex items-center justify-center gap-2 py-3 px-4 border-2 border-surface-container-highest rounded-xl font-label-md text-label-md text-on-surface-variant hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="grid_view">grid_view</span>
                                Microsoft
                            </button>
</div>
</div>
</form>
<!-- Footer Links -->
<footer class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Don't have an account? 
                        <a class="text-primary font-bold hover:underline" href="#">Sign up for free</a>
</p>
</footer>
</div>
</section>
</main>
<script>
        function setRole(role) {
            const tBtn = document.getElementById('teacherBtn');
            const sBtn = document.getElementById('studentBtn');
            
            if (role === 'teacher') {
                tBtn.className = 'flex-1 py-3 px-6 rounded-full font-label-md text-label-md flex items-center justify-center gap-2 transition-all duration-300 bg-primary-container text-on-primary-container shadow-sm';
                sBtn.className = 'flex-1 py-3 px-6 rounded-full font-label-md text-label-md flex items-center justify-center gap-2 transition-all duration-300 text-on-surface-variant';
            } else {
                sBtn.className = 'flex-1 py-3 px-6 rounded-full font-label-md text-label-md flex items-center justify-center gap-2 transition-all duration-300 bg-primary-container text-on-primary-container shadow-sm';
                tBtn.className = 'flex-1 py-3 px-6 rounded-full font-label-md text-label-md flex items-center justify-center gap-2 transition-all duration-300 text-on-surface-variant';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const hours = new Date().getHours();
            const subtitle = document.getElementById('greeting');
            if (hours < 12) subtitle.innerText = "Good morning! Time to start the class.";
            else if (hours < 18) subtitle.innerText = "Good afternoon! Your AI assistant is ready.";
            else subtitle.innerText = "Good evening! Wrapping up the school day?";
        });
    </script>
</body></html>
